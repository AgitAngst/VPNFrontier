<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f3f4f7;--sf:#fff;--sf2:#f8f9fb;--sf3:#eef0f4;--brd:#e2e5ec;--brd2:#d0d4de;--tx:#111827;--txd:#6b7280;--txm:#9ca3af;--red:#ef4444;--reds:#dc2626;--rd2:rgba(239,68,68,.06);--rdb:rgba(239,68,68,.14);--grn:#16a34a;--grn2:rgba(22,163,74,.06);--grnb:rgba(22,163,74,.14);--amb:#d97706;--am2:rgba(245,158,11,.06);--amb2:rgba(245,158,11,.14)}
body{width:100%;min-width:300px;background:var(--bg);color:var(--tx);font-family:'Manrope',sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent}
body::-webkit-scrollbar{width:0}

.hdr{padding:16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:10}
.hdr-left{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;background:linear-gradient(135deg,var(--red),#cc2222);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;font-family:'JetBrains Mono',monospace}
.hdr h1{font-size:15px;font-weight:800}.hdr .ver{font-size:10px;color:var(--txm);font-family:'JetBrains Mono',monospace}
.lang-sw{display:flex;border:1px solid var(--brd);border-radius:6px;overflow:hidden}
.lang-btn{padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;border:none;background:var(--sf);color:var(--txm);cursor:pointer;-webkit-tap-highlight-color:transparent}
.lang-btn.active{background:var(--tx);color:#fff}

/* Alert banner */
.alert-banner{margin:12px 16px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.4;display:none;position:relative}
.alert-banner.show{display:flex;gap:10px;align-items:flex-start}
.alert-banner.vpn{background:var(--am2);border:1px solid var(--amb2);color:var(--amb)}
.alert-banner.country{background:var(--rd2);border:1px solid var(--rdb);color:var(--reds)}
.alert-banner .dismiss{position:absolute;top:8px;right:10px;background:none;border:none;font-size:16px;color:inherit;opacity:.5;cursor:pointer;padding:4px}

.card{margin:12px 16px;padding:14px 16px;background:var(--sf);border:1px solid var(--brd);border-radius:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;min-height:36px}
.row+.row{border-top:1px solid var(--brd);margin-top:4px;padding-top:10px}
.lbl{color:var(--txd);font-size:13px;font-weight:500}
.val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;text-align:right;max-width:55%;word-break:break-word}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:16px;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.b-block{background:var(--rd2);color:var(--reds);border:1px solid var(--rdb)}
.b-open{background:var(--grn2);color:var(--grn);border:1px solid var(--grnb)}
.b-vpn{background:var(--am2);color:var(--amb);border:1px solid var(--amb2)}
.b-pause,.b-unk{background:var(--sf2);color:var(--txd);border:1px solid var(--brd)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.dot.p{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.sec{margin:0 16px 8px}
details summary{padding:14px 16px;background:var(--sf);border:1px solid var(--brd);border-radius:12px;font-size:14px;font-weight:600;color:var(--txd);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"▼";font-size:9px;transition:transform .2s}
details[open] summary::after{transform:rotate(180deg)}
details[open] summary{border-radius:12px 12px 0 0;border-bottom-color:transparent}
.sec-inner{padding:14px 16px;background:var(--sf);border:1px solid var(--brd);border-top:none;border-radius:0 0 12px 12px}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--sf2);border:1px solid var(--brd);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--txd);min-height:36px}
.tag.custom{color:var(--amb);border-color:var(--amb2)}
.tag .x{cursor:pointer;opacity:.5;font-size:14px;font-style:normal;padding:2px}

.add-row{display:flex;gap:8px}
.add-input{flex:1;padding:10px 14px;background:var(--sf2);border:1px solid var(--brd);border-radius:8px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;min-height:44px}
.add-input::placeholder{color:var(--txm)}
.add-btn{padding:10px 16px;background:var(--sf2);border:1px solid var(--brd);border-radius:8px;color:var(--txd);font-size:13px;font-weight:600;cursor:pointer;min-height:44px}
.add-btn:active{background:var(--sf3)}

.cond-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;min-height:40px}
.cond-item+.cond-item{border-top:1px solid var(--brd);margin-top:2px;padding-top:10px}
.cond-label{font-size:13px;color:var(--txd);font-weight:500;flex:1;padding-right:10px}
.toggle{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid var(--brd);background:var(--sf2);color:var(--txd);cursor:pointer;font-family:'JetBrains Mono',monospace;min-height:36px}
.toggle.on{background:var(--grn2);border-color:var(--grnb);color:var(--grn)}

.prov-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;min-height:40px}
.prov-item+.prov-item{border-top:1px solid var(--brd)}
.prov-name{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}

.setting-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;min-height:44px}
.setting-row+.setting-row{border-top:1px solid var(--brd);margin-top:3px;padding-top:10px}
.setting-label{font-size:13px;color:var(--txd);font-weight:500}
.sel{padding:8px 12px;background:var(--sf2);border:1px solid var(--brd);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);min-height:40px}

.hist-item{padding:8px 0;border-bottom:1px solid var(--brd)}
.hist-item:last-child{border:none}
.hist-url{font-family:'JetBrains Mono',monospace;color:var(--reds);word-break:break-all;font-size:11px}
.hist-time{color:var(--txm);font-size:11px;margin-top:2px}
.hist-empty{color:var(--txm);font-size:13px;padding:12px 0;text-align:center}

.ie-btns{display:flex;gap:8px;margin-bottom:10px}
.ie-btn{flex:1;padding:12px;background:var(--sf2);border:1px solid var(--brd);border-radius:8px;color:var(--txd);font-size:13px;font-weight:600;cursor:pointer;text-align:center;min-height:44px}
.ie-btn:active{background:var(--sf3)}
.ie-area{width:100%;min-height:60px;max-height:120px;padding:10px;background:var(--sf2);border:1px solid var(--brd);border-radius:8px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:11px;resize:vertical;outline:none}
.ie-msg{font-size:12px;color:var(--grn);margin-top:6px;min-height:16px}

.acts{padding:12px 16px;display:flex;gap:8px}
.btn{flex:1;padding:14px;border:1px solid var(--brd);border-radius:10px;background:var(--sf);color:var(--tx);font-size:14px;font-weight:600;cursor:pointer;text-align:center;min-height:48px}
.btn:active{background:var(--sf2)}
.btn-pr{background:var(--red);border-color:var(--red);color:#fff}
.btn-pr:active{background:var(--reds)}
.btn-res{background:var(--grn);border-color:var(--grn);color:#fff}

.sp{display:inline-block;width:12px;height:12px;border:2px solid var(--brd);border-top-color:var(--tx);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.ft{padding:10px 16px;border-top:1px solid var(--brd);font-size:10px;color:var(--txm);text-align:center;font-family:'JetBrains Mono',monospace}
.ld{padding:40px;text-align:center;color:var(--txd)}
</style>
</head>
<body>
<div class="hdr"><div class="hdr-left"><div class="logo">VF</div><div><h1>VPN Frontier</h1><span class="ver">v6.1.0</span></div></div><div class="lang-sw"><button class="lang-btn" id="lang-ru">RU</button><button class="lang-btn" id="lang-en">EN</button></div></div>
<div class="alert-banner" id="alert-banner"><span id="alert-text"></span><button class="dismiss" id="alert-dismiss">✕</button></div>
<div id="c"><div class="ld"><span class="sp"></span></div></div>
<script src="lang.js"></script>
<script src="popup.js"></script>
</body>
</html>
