<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPN Frontier</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#f3f4f7;--sf:#fff;--sf2:#f8f9fb;--brd:#e2e5ec;--brd2:#d0d4de;--tx:#111827;--txd:#6b7280;--txm:#9ca3af;--red:#ef4444;--reds:#dc2626;--rd2:rgba(239,68,68,.06);--rdb:rgba(239,68,68,.14);--amb:#d97706;--am2:rgba(245,158,11,.06);--amb2:rgba(245,158,11,.14);--grn:#16a34a;--grn2:rgba(22,163,74,.06);--grnb:rgba(22,163,74,.14);--r:14px}
    html{height:100%}body{min-height:100%;background:var(--bg);color:var(--tx);font-family:'Manrope',sans-serif;display:flex;justify-content:center}
    .page{width:100%;max-width:600px;padding:40px 24px 44px;display:flex;flex-direction:column;align-items:center}
    .top{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
    .brand{font-size:13px;font-weight:800;color:var(--txd);display:flex;align-items:center;gap:8px}
    .brand-dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
    .lang-sw{display:flex;border:1px solid var(--brd);border-radius:6px;overflow:hidden}
    .lang-btn{padding:5px 10px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;border:none;background:var(--sf);color:var(--txm);cursor:pointer}
    .lang-btn.active{background:var(--tx);color:#fff}
    .lang-btn:hover:not(.active){background:var(--sf2);color:var(--tx)}
    .shield{width:80px;height:80px;background:var(--rd2);border:1.5px solid var(--rdb);border-radius:22px;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
    .shield svg{width:36px;height:36px;color:var(--red)}
    h1{font-size:24px;font-weight:800;letter-spacing:-.5px;text-align:center;margin-bottom:10px;line-height:1.3}
    .sub{text-align:center;font-size:14px;line-height:1.65;color:var(--txd);max-width:460px;margin-bottom:24px}
    .card{width:100%;padding:14px 18px;background:var(--sf);border:1px solid var(--brd);border-radius:var(--r);margin-bottom:14px}
    .card-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--txm);margin-bottom:6px}
    .card-url{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:var(--reds);word-break:break-all;line-height:1.4}
    .check-area{width:100%;margin-bottom:14px}
    .check-btn{width:100%;padding:12px;background:var(--sf);border:1px solid var(--brd);border-radius:var(--r);font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;color:var(--tx);cursor:pointer}
    .check-btn:hover{background:var(--sf2);border-color:var(--brd2)}.check-btn:active{transform:scale(.98)}.check-btn:disabled{opacity:.6;cursor:default}
    .check-result{width:100%;padding:14px 18px;border-radius:var(--r);margin-top:10px;display:none}
    .check-result.show{display:block}
    .check-result.ok{background:var(--grn2);border:1px solid var(--grnb);color:var(--grn)}
    .check-result.fail{background:var(--rd2);border:1px solid var(--rdb);color:var(--reds)}
    .check-result.vpn{background:var(--am2);border:1px solid var(--amb2);color:var(--amb)}
    .cr-title{font-size:13px;font-weight:700;margin-bottom:4px}.cr-detail{font-size:12px;line-height:1.5;opacity:.85}
    .go-btn{width:100%;padding:12px;margin-top:10px;background:var(--grn);border:1px solid var(--grn);border-radius:var(--r);font-family:'Manrope',sans-serif;font-size:14px;font-weight:700;color:#fff;cursor:pointer;display:none;text-align:center}
    .go-btn.show{display:block}.go-btn:hover{opacity:.9}.go-btn:disabled{opacity:.6}
    .info-card{display:none}
    .info-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px}
    .info-row+.info-row{border-top:1px solid var(--brd);margin-top:3px;padding-top:8px}
    .info-l{color:var(--txd)}.info-v{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;text-align:right;max-width:260px;word-break:break-word}
    .warn{width:100%;padding:14px 16px;border-radius:var(--r);margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
    .warn.red{background:var(--rd2);border:1px solid var(--rdb)}.warn.amber{background:var(--am2);border:1px solid var(--amb2)}
    .warn .ic{font-size:16px;flex-shrink:0;line-height:1.4}.warn h3{font-size:13px;font-weight:700;margin-bottom:3px}
    .warn.red h3{color:var(--reds)}.warn.amber h3{color:var(--amb)}.warn p{font-size:12px;line-height:1.5;color:var(--txd)}
    details{width:100%;margin-bottom:14px}
    summary{padding:12px 18px;background:var(--sf);border:1px solid var(--brd);border-radius:var(--r);font-size:13px;font-weight:600;color:var(--txd);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;user-select:none}
    summary:hover{border-color:var(--brd2);color:var(--tx)}summary::-webkit-details-marker{display:none}
    summary::after{content:"▼";font-size:9px;transition:transform .2s}details[open] summary::after{transform:rotate(180deg)}
    details[open] summary{border-radius:var(--r) var(--r) 0 0;border-bottom-color:transparent}
    .zones-inner{padding:10px 18px 14px;background:var(--sf);border:1px solid var(--brd);border-top:none;border-radius:0 0 var(--r) var(--r);display:flex;flex-wrap:wrap;gap:5px}
    .zt{padding:3px 9px;background:var(--sf2);border:1px solid var(--brd);border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--txd)}.zt.custom{color:var(--amb)}
    .acts{display:flex;gap:8px;width:100%;margin-bottom:24px}
    .btn{flex:1;padding:12px;border-radius:10px;font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:center;border:1px solid var(--brd);background:var(--sf);color:var(--tx)}
    .btn:hover{background:var(--sf2);border-color:var(--brd2)}.btn:active{transform:scale(.97)}
    .btn-red{background:var(--rd2);border-color:var(--rdb);color:var(--reds)}
    .footer{text-align:center}.footer-l{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--txm);line-height:1.7}
    @media(max-width:480px){.page{padding:28px 16px}h1{font-size:20px}.acts{flex-direction:column}}
  </style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="brand"><span class="brand-dot"></span> VPN Frontier</div>
    <div class="lang-sw"><button class="lang-btn" id="lang-ru">RU</button><button class="lang-btn" id="lang-en">EN</button></div>
  </div>
  <div class="shield"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg></div>
  <h1 id="title"></h1><p class="sub" id="sub"></p>
  <div class="card"><div class="card-lbl" id="url-lbl"></div><div class="card-url" id="burl">—</div></div>
  <div class="check-area"><button class="check-btn" id="check-btn"></button><div class="check-result" id="check-result"><div class="cr-title" id="cr-title"></div><div class="cr-detail" id="cr-detail"></div></div><button class="go-btn" id="go-btn"></button></div>
  <div class="card info-card" id="info-card">
    <div class="info-row"><span class="info-l">IP</span><span class="info-v" id="i-ip">—</span></div>
    <div class="info-row"><span class="info-l" id="i-co-l"></span><span class="info-v" id="i-co">—</span></div>
    <div class="info-row"><span class="info-l">ISP</span><span class="info-v" id="i-org">—</span></div>
    <div class="info-row"><span class="info-l" id="i-rsn-l"></span><span class="info-v" id="i-rsn" style="color:var(--reds)">—</span></div>
  </div>
  <div class="warn red"><span class="ic">🚫</span><div><h3 id="w-vpn-h"></h3><p id="w-vpn-p"></p></div></div>
  <div class="warn amber"><span class="ic">⚠️</span><div><h3 id="w-why-h"></h3><p id="w-why-p"></p></div></div>
  <details><summary id="zones-sum"></summary><div class="zones-inner" id="zlist"></div></details>
  <div class="acts"><button class="btn" id="btn-back"></button><button class="btn btn-red" id="btn-close"></button></div>
  <div class="footer"><div class="footer-l">VPN Frontier v6.1.0</div></div>
</div>
<script src="lang.js"></script>
<script src="blocked.js"></script>
</body>
</html>
